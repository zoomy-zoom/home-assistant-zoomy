[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# pyflakes and the pycodestyle errors; the code is clean for these.
select = ["E4", "E7", "E9", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
