<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Original page host</title>
<!-- Test harness only, never shipped (compare group). The Home Assistant page around one of the ORIGINAL HOME-styled
     iframe pages (served at /old/ from ZOOMY_ORIGINALS): a home-assistant element whose hass answers zoomy_store/...
     and has the old template sensors, from the same made-up data as the new card gets. ?page=&now=&steps= -->
<style> html, body { margin: 0; overflow: hidden; } iframe { display: block; border: 0; width: 100%; height: 100vh; } </style>
</head>
<body>
<home-assistant></home-assistant>
<iframe id="f" title="page under test"></iframe>
<script src="fake-hass.js"></script>
<script src="steps.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search), f = document.getElementById('f');
  var fake = FakeHass.make({ now: Number(q.get('now')) });
  document.querySelector('home-assistant').hass = ZoomySteps.oldHass(fake, 'entry0001');
  var result = { snaps: [], errors: [] };
  window.result = result;
  var runner = ZoomySteps.make({
    root: function () { return f.contentDocument; },
    get win() { return f.contentWindow; },
    resize: function (dh) { var fe = window.frameElement; fe.style.height = (parseFloat(fe.style.height) + dh) + 'px'; }
  }, result);
  f.addEventListener('load', function () {
    try { f.contentWindow.addEventListener('error', function (e) { result.errors.push('page error: ' + e.message); }); } catch (e) { /* not reachable */ }
    runner.run(JSON.parse(q.get('steps') || '[]'), 0, function () { window.done = true; });
  });
  f.src = '/old/' + q.get('page');
})();
</script>
</body>
</html>
